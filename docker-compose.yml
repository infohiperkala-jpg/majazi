services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-majazi}
      POSTGRES_USER: ${POSTGRES_USER:-majazi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["5432:5432"]
    volumes: [majazi-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-majazi} -d ${POSTGRES_DB:-majazi}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      DataProtection__KeysPath: /var/lib/majazi/keys
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=majazi;Username=majazi;Password=change-this-local-password}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set a unique JWT_SIGNING_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-majazi-api}
      Jwt__Audience: ${JWT_AUDIENCE:-majazi-web}
      PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      Meta__AppId: ${META_APP_ID:-}
      Meta__AppSecret: ${META_APP_SECRET:-}
      Meta__RedirectUri: ${META_REDIRECT_URI:-}
      Meta__FrontendReturnUrl: ${META_FRONTEND_RETURN_URL:-/channels?meta=connected}
      AI__BaseUrl: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Model: ${AI_MODEL:-gpt-4o-mini}
      Network__InternationalDefaultProxy: ${NETWORK_INTERNATIONAL_DEFAULT_PROXY:-}
      Network__TelegramProxy: ${NETWORK_TELEGRAM_PROXY:-}
      Network__MetaProxy: ${NETWORK_META_PROXY:-}
      Network__AIProxy: ${NETWORK_AI_PROXY:-}
    volumes: [majazi-dataprotection:/var/lib/majazi/keys]
    ports: ["5080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./apps/admin-web
    environment:
      API_INTERNAL_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  majazi-postgres:
  majazi-dataprotection:
