services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-majazi}
      POSTGRES_USER: ${POSTGRES_USER:-majazi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["5432:5432"]
    volumes: [majazi-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-majazi} -d ${POSTGRES_DB:-majazi}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=majazi;Username=majazi;Password=change-this-local-password}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-development-key-change-this-before-deploy-123456789}
      Jwt__Issuer: ${JWT_ISSUER:-majazi-api}
      Jwt__Audience: ${JWT_AUDIENCE:-majazi-web}
    ports: ["5080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./apps/admin-web
    environment:
      API_INTERNAL_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  majazi-postgres:
