name: MAJAZI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/src/Majazi.Api/Majazi.Api.csproj
      - name: Build
        run: dotnet build backend/src/Majazi.Api/Majazi.Api.csproj --configuration Release --no-restore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/admin-web
        run: npm install
      - name: Type check
        working-directory: apps/admin-web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/admin-web
        env:
          API_INTERNAL_URL: http://127.0.0.1:5080
        run: npm run build
