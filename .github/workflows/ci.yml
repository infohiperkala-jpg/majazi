name: MAJAZI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and PostgreSQL migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: majazi_ci
          POSTGRES_USER: majazi
          POSTGRES_PASSWORD: majazi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majazi -d majazi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=majazi_ci;Username=majazi;Password=majazi_ci_password
      Jwt__SigningKey: majazi-ci-only-signing-key-not-for-production-2026
      Jwt__Issuer: majazi-api
      Jwt__Audience: majazi-web
      ASPNETCORE_URLS: http://127.0.0.1:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/src/Majazi.Api/Majazi.Api.csproj
      - name: Build
        run: dotnet build backend/src/Majazi.Api/Majazi.Api.csproj --configuration Release --no-restore
      - name: Smoke test API startup and all EF migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/majazi-data-protection"
          export DataProtection__KeysPath="$RUNNER_TEMP/majazi-data-protection"
          dotnet run --project backend/src/Majazi.Api/Majazi.Api.csproj --configuration Release --no-build > "$RUNNER_TEMP/majazi-api.log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5080/health >/dev/null; then
              echo "API is healthy; startup migrations completed."
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/majazi-api.log"
              exit 1
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/majazi-api.log"
          echo "API did not become healthy within 120 seconds."
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/admin-web
        run: npm install
      - name: Type check
        working-directory: apps/admin-web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: apps/admin-web
        env:
          API_INTERNAL_URL: http://127.0.0.1:5080
        run: npm run build
